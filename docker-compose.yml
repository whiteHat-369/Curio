version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: curio-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: curio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curio-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/curio?schema=public
      JWT_SECRET: production-secret-change-this-in-env
      INTERNAL_SERVICE_TOKEN: production-internal-token-change-this
      STORAGE_PROVIDER: local
      LLM_PROVIDER: openai
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
